[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmoji"
dynamic = ["version"]
description = "Making agents cuter"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }]
keywords = [
    "kaomoji",
    "claude",
    "claude-code",
    "codex",
    "grok",
    "antigravity",
    "emoticons",
    "agents",
    "interpretability",
    "mechanistic-interpretability",
    "llm",
    "ai",
    "research-tooling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Lean by design: the three synthesis SDKs (openai also serves the
# local backend), the HF client, tqdm. Embedding and figure work lives
# in llmoji-study.
dependencies = [
    "anthropic>=0.77",  # output_config structured outputs
    "openai>=1.66",  # Responses API
    "huggingface_hub>=0.25",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# ``llmoji import codex`` reads the rollouts codex-cli zstd-compresses
# in place (``rollout-*.jsonl.zst``). Python 3.14 decodes them with the
# stdlib ``compression.zstd``; older interpreters need this package.
zstd = [
    "zstandard>=0.22; python_version < '3.14'",
]
dev = [
    "pytest>=8",
    "ruff>=0.6.9",
    "pyright>=1.1.400",
]

[project.urls]
Homepage = "https://github.com/a9lim/llmoji"
Repository = "https://github.com/a9lim/llmoji"
Issues = "https://github.com/a9lim/llmoji/issues"
Releases = "https://github.com/a9lim/llmoji/releases"
Research = "https://github.com/a9lim/llmoji-study"
Dataset = "https://huggingface.co/datasets/a9lim/llmoji"

[project.scripts]
llmoji = "llmoji.cli:main"

# Hatch reads the __version__ literal without importing the package.
[tool.hatch.version]
path = "llmoji/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["llmoji"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741", "E402", "E731"]

[tool.pyright]
include = ["llmoji"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = "warning"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportAttributeAccessIssue = "error"
reportArgumentType = "error"
reportCallIssue = "error"
reportReturnType = "error"
reportAssignmentType = "error"
